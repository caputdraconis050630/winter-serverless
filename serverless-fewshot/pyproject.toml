[project]
name = "serverless-fewshot"
version = "0.1.0"
description = "Few-Shot Meta-Adaptive Traffic Forecasting for Serverless Cold-Start Mitigation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=0.20",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "ruptures>=1.1",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "ray[default]>=2.9",
    "optuna>=3.5",
    "wandb>=0.16",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
foundation = [
    "chronos-forecasting",
    "timesfm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
